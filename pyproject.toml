[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt2-nano-moe"
version = "0.1.0rc1"
description = "CapSel-2 routing experiment for a small GPT-style MoE model"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "Milos Kotlar"}]
dependencies = ["numpy>=1.26", "torch>=2.2,<3"]

[project.scripts]
gpt2-nano-moe-publication-study = "gpt2_nano_moe.publication_study:main"

[tool.setuptools.packages.find]
where = ["src"]
