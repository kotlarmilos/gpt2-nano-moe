# Full publication routing study — requires data/train.bin (FineWeb-Edu uint16).
# Run on a GPU instance with scripts/publication_study.sh.

[model]
vocab_size = 9157
context_length = 256
d_model = 384
num_heads = 6
num_layers = 6
mlp_multiplier = 4
dropout = 0.0
architecture = "moe"
expert_count = 8
auxiliary_loss_weight = 0.01

[train]
seed = 17
steps = 3000
batch_size = 16
learning_rate = 0.0003
weight_decay = 0.1
device = "auto"
log_every = 100
corpus_path = "data/train.bin"
validation_fraction = 0.1

[study]
seeds = [17, 42, 137]
threshold_quantiles = [0.25, 0.5, 0.75]
threshold_calibration_seed = 17
threshold_calibration_batches = 16
base_capacity_factor = 1.25
double_capacity_factor = 2.0
validation_batches = 16
